DFINE:
  backbone: HGNetv2
HGNetv2:
  name: B2
  return_idx:
  - 0
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
DFINETransformer:
  num_layers: 4
  eval_idx: -1
  feat_channels:
  - 256
  - 256
  - 256
  - 256
  feat_strides:
  - 4
  - 8
  - 16
  - 32
  num_levels: 4
  num_points:
  - 4
  - 4
  - 4
  - 4
HybridEncoder:
  in_channels:
  - 96
  - 384
  - 768
  - 1536
  feat_strides:
  - 4
  - 8
  - 16
  - 32
  hidden_dim: 256
  depth_mult: 0.67
  use_encoder_idx:
  - 3
  num_encoder_layers: 1
  expansion: 1.0
  use_defe: true
  defe_type: light
  use_umap_attn: true
  nhead: 8
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*norm|bn).*$
    lr: 2.0e-05
  - params: ^(?=.*backbone)(?=.*norm|bn).*$
    lr: 2.0e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
epochs: 132
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 120
  collate_fn:
    stop_epoch: 120
    ema_restart_decay: 0.9999
    base_size_repeat: 6
